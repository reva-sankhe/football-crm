kind = "web"
previewPath = "/"
title = "Football CRM"
version = "1.0.0"
id = "artifacts/football-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24197

[services.development]
run = "pnpm --filter @workspace/football-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/football-crm", "run", "build" ]
publicDir = "artifacts/football-crm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24197"
BASE_PATH = "/"
